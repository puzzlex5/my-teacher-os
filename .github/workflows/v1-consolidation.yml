name: Teacher OS 1.0 Consolidation

on:
  push:
    branches:
      - v1-consolidation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch stable main for drift audit
        run: git fetch origin main --no-tags

      - name: Guard critical raw-source drift from stable main
        run: node tests/v1-main-drift-audit.mjs

      - name: Guard raw v23 stable accuracy baseline
        run: node tests/v1-v23-source-baseline-tests.mjs

      - name: Measure synthetic document accuracy and classifier latency
        run: node tests/v1-document-quality-benchmark.mjs

      - name: Verify structured HWPX extraction core
        run: node tests/v1-hwpx-structure-tests.mjs

      - name: Prepare v1 legacy sources
        run: |
          node scripts/prepare-v1-v23-storage.mjs
          node scripts/prepare-v1-sources.mjs
          node scripts/prepare-v1-hwpx-structure.mjs
          node scripts/prepare-v1-v23-multisheet.mjs
          node scripts/prepare-v1-v23-pdf-layout.mjs
          node scripts/prepare-v1-lazy-doc-deps.mjs
          node scripts/prepare-v1-lazy-doc-shell.mjs
          node scripts/prepare-v1-comcigan-status.mjs

      - name: Guard critical stable-main accuracy parity
        run: node tests/v1-main-critical-parity-tests.mjs

      - name: Verify v1 Comcigan collector truth state
        run: node tests/v1-v14-collector-truth-tests.mjs

      - name: Existing regression baseline
        run: |
          set -euo pipefail
          for f in tests/core-tests.js tests/v06-tests.js tests/v07-tests.js tests/v08-tests.js tests/v09-tests.js tests/v10-tests.js tests/v11-tests.js tests/v12-tests.js tests/v13-tests.js tests/v14-tests.js tests/v15-tests.js tests/v16-tests.js tests/v17-tests.js tests/v18-tests.js tests/v19-tests.js tests/v20-tests.js tests/v21-tests.js tests/v22-tests.js tests/v23-tests.js tests/v24-tests.js tests/v25-tests.js tests/v26-tests.js tests/v27-tests.js tests/v28-tests.js tests/v29-tests.js tests/v30-tests.js tests/v31-tests.js tests/v32-tests.js; do
            test -f "$f" && node "$f"
          done

      - name: Verify v1 intake accuracy sync
        run: node tests/v1-v23-accuracy-tests.mjs

      - name: Verify v1 multi-sheet spreadsheet intake
        run: node tests/v1-v23-multisheet-tests.mjs

      - name: Verify v1 native PDF positional intake
        run: node tests/v1-v23-pdf-layout-tests.mjs

      - name: Verify v1 calendar Undo storage boundary
        run: node tests/v1-v28-storage-tests.mjs

      - name: Verify v1 document-version storage boundary
        run: node tests/v1-v30-storage-tests.mjs

      - name: Verify v1 source-retention storage boundary
        run: node tests/v1-v31-storage-tests.mjs

      - name: Verify frozen runtime baseline
        run: node tests/v1-consolidation-tests.mjs

      - name: Syntax check shared storage service
        run: node --check v1-storage-service.js

      - name: Build separate-layer reference and consolidated preview
        run: node scripts/build-v1-runtime.mjs

      - name: Verify v1 lazy document dependencies
        run: node tests/v1-lazy-doc-deps-tests.mjs

      - name: Audit consolidated storage boundary through v0.32
        run: node tests/v1-storage-boundary-audit-tests.mjs

      - name: Syntax check consolidated runtime
        run: node --check dist-v1/teacher-os-v1.runtime.js

      - name: Install Chromium parity runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser parity — separate historical layers vs bundled runtime
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/teacher-os-v1-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          npx playwright test tests/v1-browser-bundle-parity.spec.js --reporter=line --workers=1

      - name: Bundle report
        if: always()
        run: cat dist-v1/asset-report.json

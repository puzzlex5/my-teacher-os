name: Sync Comcigan timetable

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes; GitHub may delay scheduled runs
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'comcigan-config.json'
      - 'scripts/sync-comcigan.mjs'
      - '.github/workflows/sync-comcigan.yml'

permissions:
  contents: write

concurrency:
  group: comcigan-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned parser
        run: npm install --no-save --ignore-scripts comcigan@3.0.4

      - name: Fetch teacher timetable
        run: node scripts/sync-comcigan.mjs

      - name: Commit timetable only when changed
        run: |
          if [ ! -f live/comcigan.json ]; then
            echo "No timetable output; nothing to commit."
            exit 0
          fi
          git config user.name "teacher-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live/comcigan.json
          if git diff --cached --quiet; then
            echo "No timetable change."
          else
            git commit -m "Update live Comcigan timetable"
            git push
          fi

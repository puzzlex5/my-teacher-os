name: Sync Comcigan timetable

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes; GitHub may delay scheduled runs
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'comcigan-config.json'
      - 'scripts/sync-comcigan.mjs'
      - '.github/workflows/sync-comcigan.yml'

permissions:
  contents: write

concurrency:
  group: comcigan-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned parser
        run: npm install --no-save --ignore-scripts comcigan@3.0.4

      - name: Fetch teacher timetable
        id: fetch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/sync-comcigan.mjs > /tmp/comcigan-fetch.log 2>&1
          code=$?
          category=runtime
          if [ "$code" -eq 0 ] && [ -f live/comcigan.json ]; then
            category=ok
          elif grep -Eqi 'ECONN|ETIMEDOUT|ENOTFOUND|socket|network|fetch failed|connect' /tmp/comcigan-fetch.log; then
            category=network
          elif grep -Eqi 'could not be resolved|matched multiple|does not match index|teacher' /tmp/comcigan-fetch.log; then
            category=teacher-resolution
          elif grep -Eqi 'no timetable slots|no timetable|empty' /tmp/comcigan-fetch.log; then
            category=empty
          elif grep -Eqi 'export not found|module|parser' /tmp/comcigan-fetch.log; then
            category=parser
          fi
          echo "category=$category" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Record sanitized collector health
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          FETCH_CATEGORY: ${{ steps.fetch.outputs.category }}
        run: |
          mkdir -p live
          if [ "$FETCH_OUTCOME" = "success" ] && [ -f live/comcigan.json ]; then
            printf '%s\n' '{"status":"ok","category":"ok"}' > live/comcigan-status.json
          else
            printf '%s\n' "{\"status\":\"error\",\"category\":\"${FETCH_CATEGORY:-runtime}\"}" > live/comcigan-status.json
          fi

      - name: Commit live state only when changed
        run: |
          git config user.name "teacher-os-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live/comcigan-status.json
          if [ -f live/comcigan.json ]; then git add live/comcigan.json; fi
          if git diff --cached --quiet; then
            echo "No Comcigan state change."
          else
            git commit -m "Update live Comcigan state"
            git push
          fi

      - name: Fail workflow when collection failed
        if: steps.fetch.outcome != 'success'
        run: exit 1

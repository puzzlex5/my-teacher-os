name: Diagnose GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - diagnostics/pages-trigger.txt

permissions:
  contents: write
  pages: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Pages and deploy workflow diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostics
          H1="Accept: application/vnd.github+json"
          H2="Authorization: Bearer $GH_TOKEN"
          H3="X-GitHub-Api-Version: 2026-03-10"
          curl -sS -H "$H1" -H "$H2" -H "$H3" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" > diagnostics/pages-site.json || true
          curl -sS -H "$H1" -H "$H2" -H "$H3" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds/latest" > diagnostics/pages-build-latest.json || true
          curl -sS -H "$H1" -H "$H2" -H "$H3" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?per_page=10" > diagnostics/deploy-runs.json || true
          RUN_ID=$(jq -r '.workflow_runs[0].id // empty' diagnostics/deploy-runs.json)
          if [ -n "$RUN_ID" ]; then
            curl -sS -H "$H1" -H "$H2" -H "$H3" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" > diagnostics/deploy-latest-jobs.json || true
          else
            printf '{"message":"No deploy workflow run found"}\n' > diagnostics/deploy-latest-jobs.json
          fi
          ROOT_STATUS=$(curl -L -sS -o diagnostics/live-root.html -w '%{http_code}' 'https://puzzlex5.github.io/' || true)
          PROJECT_STATUS=$(curl -L -sS -o diagnostics/live-project.html -w '%{http_code}' 'https://puzzlex5.github.io/my-teacher-os/' || true)
          CORE25_STATUS=$(curl -L -sS -o diagnostics/live-core-v25.js -w '%{http_code}' 'https://puzzlex5.github.io/my-teacher-os/core-v25.js' || true)
          V25_STATUS=$(curl -L -sS -o diagnostics/live-v25.js -w '%{http_code}' 'https://puzzlex5.github.io/my-teacher-os/app-v25.js' || true)
          V25CSS_STATUS=$(curl -L -sS -o diagnostics/live-v25.css -w '%{http_code}' 'https://puzzlex5.github.io/my-teacher-os/app-v25.css' || true)
          QUALITYLIB_STATUS=$(curl -L -sS -o diagnostics/live-record-quality-library.json -w '%{http_code}' 'https://puzzlex5.github.io/my-teacher-os/school-record-quality-library.json' || true)
          V24_STATUS=$(curl -L -sS -o diagnostics/live-v24.js -w '%{http_code}' 'https://puzzlex5.github.io/my-teacher-os/app-v24.js' || true)
          V24CSS_STATUS=$(curl -L -sS -o diagnostics/live-v24.css -w '%{http_code}' 'https://puzzlex5.github.io/my-teacher-os/app-v24.css' || true)
          CORE23_STATUS=$(curl -L -sS -o diagnostics/live-core-v23.js -w '%{http_code}' 'https://puzzlex5.github.io/my-teacher-os/core-v23.js' || true)
          V23_STATUS=$(curl -L -sS -o diagnostics/live-v23.js -w '%{http_code}' 'https://puzzlex5.github.io/my-teacher-os/app-v23.js' || true)
          V23CSS_STATUS=$(curl -L -sS -o diagnostics/live-v23.css -w '%{http_code}' 'https://puzzlex5.github.io/my-teacher-os/app-v23.css' || true)
          INDEX_HAS_V25=$(grep -q 'core-v25.js' diagnostics/live-project.html && grep -q 'app-v25.js' diagnostics/live-project.html && grep -q 'app-v25.css' diagnostics/live-project.html && echo true || echo false)
          printf '{"root":"%s","project":"%s","core25":"%s","v25":"%s","v25css":"%s","recordQualityLibrary":"%s","v24":"%s","v24css":"%s","core23":"%s","v23":"%s","v23css":"%s","indexHasV25":%s}\n' "$ROOT_STATUS" "$PROJECT_STATUS" "$CORE25_STATUS" "$V25_STATUS" "$V25CSS_STATUS" "$QUALITYLIB_STATUS" "$V24_STATUS" "$V24CSS_STATUS" "$CORE23_STATUS" "$V23_STATUS" "$V23CSS_STATUS" "$INDEX_HAS_V25" > diagnostics/live-http-status.json
          head -c 1300 diagnostics/live-project.html > diagnostics/live-project-head.txt || true
          printf '{"checkedAt":"%s","sha":"%s","latestRunId":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" "$RUN_ID" > diagnostics/pages-check.json

      - name: Commit diagnostics
        run: |
          git config user.name "teacher-os-diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/pages-site.json diagnostics/pages-build-latest.json diagnostics/deploy-runs.json diagnostics/deploy-latest-jobs.json diagnostics/live-http-status.json diagnostics/live-project-head.txt diagnostics/pages-check.json
          if git diff --cached --quiet; then
            echo "No diagnostics change"
          else
            git commit -m "Record Pages diagnostics"
            git push
          fi

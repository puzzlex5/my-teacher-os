name: Teacher OS Quality Guard

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teacher-os-quality-guard
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regression tests
        run: |
          set -euo pipefail
          node tests/core-tests.js
          node tests/v06-tests.js
          node tests/v07-tests.js
          node tests/v08-tests.js
          node tests/v09-tests.js
          node tests/v10-tests.js
          node tests/v11-tests.js
          node tests/v12-tests.js
          node tests/v13-tests.js
          node tests/v14-tests.js
          node tests/v15-tests.js
          node tests/v16-tests.js
          node tests/v17-tests.js
          node tests/v18-tests.js
          node tests/v19-tests.js
          node tests/v20-tests.js
          node tests/v21-tests.js
          node tests/v22-tests.js
          node tests/v23-tests.js
          node tests/v24-tests.js
          node tests/v25-tests.js
          node tests/v26-tests.js

      - name: JavaScript syntax guard
        run: |
          set -euo pipefail
          for f in app-v07.js app-v08.js app-v09.js app-v10.js app-v11.js app-v12.js app-v13.js app-v14.js app-v15.js app-v16.js app-v17.js app-v18.js app-v19.js app-v20.js app-v21.js app-v22.js app-v23.js app-v24.js app-v25.js app-v26.js core-v23.js core-v25.js core-v09.js seed-v07.js scripts/sync-comcigan.mjs; do
            node --check "$f"
          done

      - name: Tester feedback guard
        run: |
          set -euo pipefail
          grep -q 'myTeacherOS.feedbackReports.v1' app-v26.js
          grep -q '학생 이름·상담내용·전화번호' app-v26.js
          grep -q 'navigator.share' app-v26.js
          grep -q 'issues/new' app-v26.js
          grep -q '@media(max-width:680px)' app-v26.css
          grep -q 'app-v26.js' index.html
          grep -q 'app-v26.css' index.html

      - name: School-record quality guard
        run: |
          set -euo pipefail
          grep -q 'NO_EVIDENCE' core-v25.js
          grep -q 'PROHIBITED' core-v25.js
          grep -q 'UNSUPPORTED' core-v25.js
          grep -q '합격 가능성 점수' app-v25.js
          grep -q '공식 기준 보기' app-v25.js
          grep -q '교육부' school-record-quality-library.json
          grep -q 'core-v25.js' index.html
          grep -q 'app-v25.css' index.html

      - name: Personal isolation guard
        run: |
          set -euo pipefail
          grep -q "readLocalConfig()||blankConfig()" app-v14.js
          ! grep -q "fetch('./comcigan-config.json" app-v14.js
          grep -q "if(!completeConfig(config))" app-v14.js
          grep -q "myTeacherOS.deviceProfile.v1" app-v24.js
          grep -q "y.clubs=\[\]" app-v24.js
          grep -q "y.roleProfile={roles:\[\]" app-v24.js

      - name: Document intelligence guard
        run: |
          set -euo pipefail
          grep -q 'PP-OCRv5' app-v23.js
          grep -q 'pdf-hybrid-layout+ocr' app-v23.js
          grep -q 'feedbackSignature' app-v23.js
          grep -q '학생자료는 자동 적용 차단' app-v23.js

      - name: Mobile layout guard
        run: |
          set -euo pipefail
          grep -q '@media(max-width:680px)' app-v26.css
          grep -q '@media(max-width:780px)' app-v25.css
          grep -q '@media(max-width:680px)' app-v24.css
          grep -q 'height:auto!important' app-v20.css
          grep -q 'max-height:76px!important' app-v20.css
          grep -q 'safe-area-inset-bottom' app-v20.css

      - name: Public-repo privacy guard
        run: |
          set -euo pipefail
          find . -type f \( -iname '*.m4a' -o -iname '*.mp3' -o -iname '*.wav' -o -iname '*.aac' -o -iname '*.ogg' \) -not -path './.git/*' -print > /tmp/audio-files.txt
          if [ -s /tmp/audio-files.txt ]; then
            echo 'Audio files must not be committed to the public Teacher OS repository.'
            cat /tmp/audio-files.txt
            exit 1
          fi

      - name: Live site smoke test
        run: |
          set -euo pipefail
          base='https://puzzlex5.github.io/my-teacher-os'
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v26.js" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v26.css" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/core-v25.js" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v25.js" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v25.css" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/school-record-quality-library.json" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v24.js" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 3 "$base/app-v23.js" >/dev/null

      - name: Quality summary
        if: always()
        run: |
          {
            echo '## Teacher OS Quality Guard'
            echo ''
            echo '- Regression tests through v0.26: checked'
            echo '- JavaScript syntax through v0.26: checked'
            echo '- Tester feedback loop, privacy warning and share fallback: checked'
            echo '- Grounded school-record quality and prohibited-expression guard: checked'
            echo '- Per-browser personal isolation and Comcigan blocking: checked'
            echo '- Document Intelligence OCR/classifier safety: checked'
            echo '- Mobile responsive feedback and quality studio: checked'
            echo '- Public repository audio privacy: checked'
            echo '- GitHub Pages live assets through v0.26: checked'
          } >> "$GITHUB_STEP_SUMMARY"

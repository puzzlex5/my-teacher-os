name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run Teacher OS core tests
        run: |
          node tests/core-tests.js
          node tests/v06-tests.js
          node tests/v07-tests.js
          node tests/v08-tests.js
          node tests/v09-tests.js
          node tests/v10-tests.js
          node tests/v11-tests.js
          node --check app-v07.js
          node --check app-v08.js
          node --check app-v09.js
          node --check app-v10.js
          node --check app-v11.js
          node --check core-v09.js
          node --check seed-v07.js
          node --check scripts/sync-comcigan.mjs
      - name: Verify v0.11 files
        run: test -f app-v11.html && test -f app-v11.js && test -f app-v11.css && test -f app-v10.html && test -f app-v10.js && test -f app-v09.js && test -f core-v09.js && test -f scripts/sync-comcigan.mjs && test -f policy-registry.json
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

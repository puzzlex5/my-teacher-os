name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run Teacher OS core tests
        run: |
          node tests/core-tests.js
          node tests/v06-tests.js
          node tests/v07-tests.js
          node tests/v08-tests.js
          node tests/v09-tests.js
          node tests/v10-tests.js
          node tests/v11-tests.js
          node tests/v12-tests.js
          node tests/v13-tests.js
          node tests/v14-tests.js
          node tests/v15-tests.js
          node tests/v16-tests.js
          node tests/v17-tests.js
          node --check app-v07.js
          node --check app-v08.js
          node --check app-v09.js
          node --check app-v10.js
          node --check app-v11.js
          node --check app-v12.js
          node --check app-v13.js
          node --check app-v14.js
          node --check app-v15.js
          node --check app-v16.js
          node --check app-v17.js
          node --check core-v09.js
          node --check seed-v07.js
          node --check scripts/sync-comcigan.mjs
      - name: Verify v0.17 files
        run: test -f app-v17.html && test -f app-v17.js && test -f app-v17.css && test -f app-v16.html && test -f comcigan-config.json && test -f scripts/sync-comcigan.mjs && test -f .github/workflows/sync-comcigan.yml && test -f policy-registry.json
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

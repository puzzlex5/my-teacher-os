name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deploy files
        run: |
          set -euo pipefail
          test -f index.html
          test -f agent-core-v33.js
          test -f app-v33.js
          test -f app-v33.css
          test -f integration-core-v34.js
          test -f app-v34.js
          test -f app-v34.css
          test -f neis-core-v35.js
          test -f app-v35.js
          test -f app-v35.css
          test -f app-v32.js
          test -f app-v32.css
          test -f core-v31.js
          test -f app-v31.js
          test -f app-v31.css
          test -f core-v30.js
          test -f app-v30.js
          test -f app-v30.css
          test -f core-v29.js
          test -f app-v29.js
          test -f core-v28.js
          test -f app-v28.js
          test -f app-v28.css
          test -f core-v27.js
          test -f app-v27.js
          test -f app-v27.css
          test -f core-v25.js
          test -f school-record-quality-library.json
          test -f core-v23.js
          test -f work-library.json
          test -f comcigan-config.json
          test -f scripts/sync-comcigan.mjs
          test -f policy-registry.json
          grep -q 'max-height:76px!important' app-v20.css
          grep -q 'height:auto!important' app-v20.css

      - name: Run regression checks
        run: |
          set -euo pipefail
          node tests/core-tests.js
          for f in $(find tests -maxdepth 1 -name 'v*-tests.js' | sort -V); do
            echo "== $f =="
            node "$f"
          done

      - name: JavaScript syntax checks
        run: |
          set -euo pipefail
          for f in $(find . -maxdepth 1 -type f \( -name 'app-v*.js' -o -name 'core-v*.js' -o -name 'agent-core-v*.js' -o -name 'integration-core-v*.js' -o -name 'neis-core-v*.js' -o -name 'seed-v*.js' \) | sort -V); do
            node --check "$f"
          done
          node --check scripts/sync-comcigan.mjs

      - name: Verify latest layers are wired
        run: |
          set -euo pipefail
          grep -q 'app-v35.js' index.html
          grep -q 'app-v35.css' index.html
          grep -q 'neis-core-v35.js' index.html
          grep -q 'app-v34.js' index.html
          grep -q 'integration-core-v34.js' index.html
          grep -q 'app-v33.js' index.html
          grep -q 'agent-core-v33.js' index.html
          grep -q 'app-v32.js' index.html
          grep -q 'myTeacherOS.deviceStorageSelfTest.v1' app-v32.js
          grep -q 'opt.disabled=!passed' app-v32.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

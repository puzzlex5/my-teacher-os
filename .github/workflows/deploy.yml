name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deploy files
        run: |
          test -f index.html
          test -f core-v30.js
          test -f app-v30.js
          test -f app-v30.css
          test -f core-v29.js
          test -f app-v29.js
          test -f core-v28.js
          test -f app-v28.js
          test -f app-v28.css
          test -f core-v27.js
          test -f app-v27.js
          test -f app-v27.css
          test -f app-v26.js
          test -f app-v26.css
          test -f core-v25.js
          test -f app-v25.js
          test -f app-v25.css
          test -f school-record-quality-library.json
          test -f app-v24.js
          test -f app-v24.css
          test -f core-v23.js
          test -f app-v23.js
          test -f app-v23.css
          test -f app-v22.js
          test -f app-v22.css
          test -f app-v21.js
          test -f app-v21.css
          test -f app-v20.js
          test -f app-v20.css
          test -f app-v19.js
          test -f app-v19.css
          test -f work-library.json
          test -f app-v18.js
          test -f app-v18.css
          test -f app-v17.html
          test -f app-v17.js
          test -f app-v17.css
          test -f comcigan-config.json
          test -f scripts/sync-comcigan.mjs
          test -f policy-registry.json
          grep -q 'max-height:76px!important' app-v20.css
          grep -q 'height:auto!important' app-v20.css
          grep -q 'core-v30.js' index.html
          grep -q 'app-v30.js' index.html
          grep -q 'app-v30.css' index.html

      - name: Run regression checks
        run: |
          node tests/core-tests.js
          node tests/v06-tests.js
          node tests/v07-tests.js
          node tests/v08-tests.js
          node tests/v09-tests.js
          node tests/v10-tests.js
          node tests/v11-tests.js
          node tests/v12-tests.js
          node tests/v13-tests.js
          node tests/v14-tests.js
          node tests/v15-tests.js
          node tests/v16-tests.js
          node tests/v17-tests.js
          node tests/v18-tests.js
          node tests/v19-tests.js
          node tests/v20-tests.js
          node tests/v21-tests.js
          node tests/v22-tests.js
          node tests/v23-tests.js
          node tests/v24-tests.js
          node tests/v25-tests.js
          node tests/v26-tests.js
          node tests/v27-tests.js
          node tests/v28-tests.js
          node tests/v29-tests.js
          node tests/v30-tests.js
          node --check app-v07.js
          node --check app-v08.js
          node --check app-v09.js
          node --check app-v10.js
          node --check app-v11.js
          node --check app-v12.js
          node --check app-v13.js
          node --check app-v14.js
          node --check app-v15.js
          node --check app-v16.js
          node --check app-v17.js
          node --check app-v18.js
          node --check app-v19.js
          node --check app-v20.js
          node --check app-v21.js
          node --check app-v22.js
          node --check app-v23.js
          node --check app-v24.js
          node --check app-v25.js
          node --check app-v26.js
          node --check app-v27.js
          node --check app-v28.js
          node --check app-v29.js
          node --check app-v30.js
          node --check core-v23.js
          node --check core-v25.js
          node --check core-v27.js
          node --check core-v28.js
          node --check core-v29.js
          node --check core-v30.js
          node --check core-v09.js
          node --check seed-v07.js
          node --check scripts/sync-comcigan.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
